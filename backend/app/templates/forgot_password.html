{% extends "auth_base.html" %}
{% block page_title %}{{ t('forgot.page_title') }}{% endblock %}
{% block card %}
      <h1>{{ t('forgot.heading') }}</h1>
      <p class="auth-intro">{{ t('forgot.description') }}</p>
      <form id="forgot-form">
        <div class="field">
          <label>{{ t('forgot.identifier_label') }}</label>
          <input id="f-identifier" required autofocus autocomplete="username">
        </div>
        <button type="submit">{{ t('forgot.submit') }}</button>
        <div class="auth-note" id="forgot-note"></div>
      </form>
      <div class="auth-switch"><a href="login">{{ t('forgot.back_to_login') }}</a></div>
{% endblock %}
{% block scripts %}
  <script>
    const SENT = {{ t('forgot.sent')|tojson }};
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      await fetch('api/auth/password-reset/request', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier: document.getElementById('f-identifier').value })
      });
      // Immer dieselbe Rueckmeldung, egal was der Server getan hat - der
      // Endpunkt antwortet bewusst immer mit 204 (kein Orakel darueber,
      // welche Konten und Adressen es auf diesem Server gibt), also darf die
      // Oberflaeche hier auch nichts unterscheiden.
      document.getElementById('forgot-note').textContent = SENT;
      e.target.querySelector('input').disabled = true;
    });
  </script>
{% endblock %}
