<!DOCTYPE html>
<html lang="{{ lang|default('de') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t('register.page_title') }}</title>
  <link rel="stylesheet" href="static/style.css">
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card { width: 100%; max-width: 360px; }
    .auth-card h1 { margin-bottom: 16px; }
    .auth-card .field { margin-bottom: 14px; }
    .auth-card button { width: 100%; margin-top: 8px; }
    .auth-error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 1em; }
    .auth-switch { margin-top: 16px; font-size: 13px; color: var(--muted); text-align: center; }
    .auth-switch a { color: var(--accent2); }
    .auth-hint { font-size: 12px; color: var(--muted); margin-top: -8px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>{{ t('register.heading') }}</h1>
      <form id="register-form">
        <div class="field"><label>{{ t('register.username_label') }}</label><input id="r-username" required minlength="3" autofocus></div>
        <div class="field"><label>{{ t('register.password_label') }}</label><input type="password" id="r-password" required minlength="8"></div>
        <div class="auth-hint">{{ t('register.password_hint') }}</div>
        <div class="field"><label>{{ t('register.password_confirm_label') }}</label><input type="password" id="r-password-confirm" required minlength="8"></div>
        <button type="submit">{{ t('register.submit') }}</button>
        <div class="auth-error" id="register-error"></div>
      </form>
      <div class="auth-switch">{{ t('register.have_account') }} <a href="login">{{ t('register.login_link') }}</a></div>
    </div>
  </div>
  <script>
    const REGISTER_PASSWORD_MISMATCH = {{ t('register.password_mismatch')|tojson }};
    const REGISTER_ERROR_DEFAULT = {{ t('register.error_default')|tojson }};
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('register-error');
      errorEl.textContent = '';
      const password = document.getElementById('r-password').value;
      const confirm = document.getElementById('r-password-confirm').value;
      if (password !== confirm) {
        errorEl.textContent = REGISTER_PASSWORD_MISMATCH;
        return;
      }
      const res = await fetch('api/auth/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('r-username').value,
          password,
        })
      });
      if (res.ok) {
        window.location = '.';
      } else {
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.detail || REGISTER_ERROR_DEFAULT;
      }
    });
  </script>
</body>
</html>
