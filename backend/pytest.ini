[pytest]
testpaths = tests
# tests/conftest.py legt das Arbeitsverzeichnis und die Test-Engine fest und
# muss deshalb vor allen Testmodulen laufen; `rootdir`-relative Importe der
# Helfer (from conftest import ...) brauchen tests/ auf dem sys.path.
pythonpath = . tests
filterwarnings =
    # Von Starlette/anyio bzw. dem Jinja2-Aufruf in main.py - nichts, was ein
    # Testlauf beeinflusst, aber genug Rauschen, um echte Warnungen zu verdecken.
    ignore::DeprecationWarning
