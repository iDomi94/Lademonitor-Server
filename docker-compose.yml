services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-charging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-charging}
      POSTGRES_DB: ${POSTGRES_DB:-charging}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-charging}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-charging}:${POSTGRES_PASSWORD:-charging}@db:5432/${POSTGRES_DB:-charging}
      # Optionaler Schluessel fuer die Feld-Verschluesselung (GPS-Koordinaten,
      # Notizen, siehe backend/app/crypto.py) - ohne Default wie bei den
      # Postgres-Zugangsdaten oben, aber NICHT mit `:?` erzwungen: wer nur im
      # eigenen Heimnetz unterwegs ist, braucht die Verschluesselung nicht,
      # dann bleibt die Variable einfach leer und die App laeuft unverschluesselt
      # weiter. In .env eintragen (siehe .env.example), um sie zu aktivieren.
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      # Kontaktdaten des datenschutzrechtlich Verantwortlichen fuer /privacy
      # (siehe .env.example) - leer laesst die Seite mit einem deutlichen
      # Hinweis statt stillschweigend unvollstaendigen Angaben laufen.
      PRIVACY_CONTROLLER_NAME: ${PRIVACY_CONTROLLER_NAME:-}
      PRIVACY_CONTROLLER_ADDRESS: ${PRIVACY_CONTROLLER_ADDRESS:-}
      PRIVACY_CONTROLLER_EMAIL: ${PRIVACY_CONTROLLER_EMAIL:-}
    ports:
      - "8111:8000"
